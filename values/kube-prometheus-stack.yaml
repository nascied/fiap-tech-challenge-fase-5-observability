prometheus:
  prometheusSpec:
    retention: 7d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

grafana:
  adminPassword: "admin"

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi
    # "alertmanager-slack-webhook" e "alertmanager-pagerduty-key" vêm de Secrets
    # provisionados fora deste repositório (CI/CD), mesmo padrão do
    # "datadog-secret" em otel-collector.yaml — nunca versionar valor real.
    # Montam em /etc/alertmanager/secrets/<nome-do-secret>/<chave>.
    secrets:
      - alertmanager-slack-webhook
      - alertmanager-pagerduty-key

  # Roteamento por severidade (ITSM/AIOps — ver docs/itsm-aiops.md). As regras
  # que alimentam os labels "severity"/"service"/"tier" ficam em
  # alerting/prometheusrule-slo-burn.yaml. Alertas "critical" vão em paralelo
  # pro Slack (humano) e pro PagerDuty (dispara o self-healing automático,
  # ver docs/itsm-aiops.md seção 3.1 — hoje só donation-service gera critical).
  config:
    global:
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/webhook-url
    route:
      receiver: default
      group_by: ["alertname", "service"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - severity="critical"
          receiver: critical
          repeat_interval: 1h
        - matchers:
            - severity="warning"
          receiver: warning-slack
    receivers:
      - name: default
      - name: critical
        slack_configs:
          - channel: "#solidary-tech-incidentes-criticos"
            send_resolved: true
            title: "{{ .CommonLabels.severity | toUpper }} — {{ .CommonLabels.alertname }} ({{ .CommonLabels.service }})"
            text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-pagerduty-key/routing-key
            send_resolved: true
            severity: critical
            description: "{{ .CommonLabels.alertname }} ({{ .CommonLabels.service }})"
            details:
              service: "{{ .CommonLabels.service }}"
              tier: "{{ .CommonLabels.tier }}"
              slo_type: "{{ .CommonLabels.slo_type }}"
              summary: "{{ .CommonAnnotations.summary }}"
      - name: warning-slack
        slack_configs:
          - channel: "#solidary-tech-alertas"
            send_resolved: true
            title: "{{ .CommonLabels.severity | toUpper }} — {{ .CommonLabels.alertname }} ({{ .CommonLabels.service }})"
            text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
